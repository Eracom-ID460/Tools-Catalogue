name: Build & deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # pour réécrire index.html
  pages: write
  id-token: write

# Une seule publication à la fois, mais on n'annule pas celles en attente :
# si plusieurs élèves poussent en même temps, chaque build passe à son tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assembler index.html depuis les fiches
        run: node build.mjs

      # index.html est réécrit sur place : on le renvoie sur main pour que la
      # page reste une page statique complète, utilisable hors de Git.
      # (Un push fait avec GITHUB_TOKEN ne redéclenche pas ce workflow.)
      - name: Publier index.html sur main
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html inchangé"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Regénérer index.html [skip ci]"
          # quelqu'un a pu pousser entre-temps
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
