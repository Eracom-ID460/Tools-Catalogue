<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Modèle de fiche</title>
	<!-- ../../ = remonter jusqu'à la racine du projet, pour la prévisualisation -->
	<link rel="stylesheet" href="../../style.css">
</head>
<body class="gallery">

<!-- Une seule <figure> par fiche. Les chemins d'image sont relatifs à CE fichier. -->
<figure class="specimen">
	<img src="mon-image.png" alt="Capture d'écran de l'outil">
	<figcaption>
		<p class="title">Nom de l'outil</p>
		<p class="link"><a href="https://exemple.com">exemple.com</a></p>
		<p class="creator">Prénom Nom</p>
	</figcaption>
</figure>

</body>
</html>
